version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

# Patch/minor PRs are auto-approved and auto-merged by
# .github/workflows/dependabot-auto-merge.yml; majors need manual review.
