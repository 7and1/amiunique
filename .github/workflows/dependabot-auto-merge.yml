name: Dependabot Auto-Merge

# Auto-approves and enables auto-merge for Dependabot patch/minor updates.
# Majors stay manual — they need real evaluation (see the declined TS 7 bump).
# Merge fires only after branch protection is satisfied: 1 approving review
# (granted here) + the three required Security Check jobs.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Approve and enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == '7and1/amiunique'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and enable auto-merge (patch/minor only)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave majors for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "Major version bump (${{ steps.metadata.outputs.dependency-names }}) — manual review required."
