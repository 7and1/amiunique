name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: production
  cancel-in-progress: true

jobs:
  # Gate every deployment on lint + tests
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # Build and deploy API Worker
  deploy-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      deployments: write
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API Worker
        run: pnpm build:api

      - name: Create wrangler.toml with secrets
        working-directory: apps/api
        run: |
          cat > wrangler.toml << 'TOML'
          name = "amiunique-api"
          main = "src/index.ts"
          compatibility_date = "2024-01-01"
          workers_dev = true

          [dev]
          port = 8787

          [vars]
          ENVIRONMENT = "development"
          IPBOT_API_ORIGIN = "${{ secrets.IPBOT_API_ORIGIN }}"

          [[d1_databases]]
          binding = "DB"
          database_name = "amiunique-db"
          database_id = "${{ secrets.D1_DATABASE_ID }}"

          [[kv_namespaces]]
          binding = "RATE_LIMIT_KV"
          id = "${{ secrets.KV_NAMESPACE_ID }}"
          preview_id = "${{ secrets.KV_PREVIEW_ID }}"

          [[ratelimits]]
          name = "IP_INTEL_RATE_LIMITER"
          namespace_id = "2026071801"

          [ratelimits.simple]
          limit = 10
          period = 60

          [[ratelimits]]
          name = "ANALYZE_RATE_LIMITER"
          namespace_id = "2026071803"

          [ratelimits.simple]
          limit = 10
          period = 60

          [[ratelimits]]
          name = "DELETION_RATE_LIMITER"
          namespace_id = "2026071804"

          [ratelimits.simple]
          limit = 5
          period = 60

          [[ratelimits]]
          name = "STATS_RATE_LIMITER"
          namespace_id = "2026071805"

          [ratelimits.simple]
          limit = 60
          period = 60

          [[ratelimits]]
          name = "HEALTH_RATE_LIMITER"
          namespace_id = "2026071806"

          [ratelimits.simple]
          limit = 120
          period = 60

          [triggers]
          crons = [
            "0 * * * *",
            "*/5 * * * *"
          ]

          [env.production]
          name = "amiunique-api"
          workers_dev = true

          [env.production.vars]
          ENVIRONMENT = "production"
          IPBOT_API_ORIGIN = "${{ secrets.IPBOT_API_ORIGIN }}"

          [[env.production.d1_databases]]
          binding = "DB"
          database_name = "amiunique-db"
          database_id = "${{ secrets.D1_DATABASE_ID }}"

          [[env.production.kv_namespaces]]
          binding = "RATE_LIMIT_KV"
          id = "${{ secrets.KV_NAMESPACE_ID_PROD }}"

          [[env.production.ratelimits]]
          name = "IP_INTEL_RATE_LIMITER"
          namespace_id = "2026071802"

          [env.production.ratelimits.simple]
          limit = 10
          period = 60

          [[env.production.ratelimits]]
          name = "ANALYZE_RATE_LIMITER"
          namespace_id = "2026071807"

          [env.production.ratelimits.simple]
          limit = 10
          period = 60

          [[env.production.ratelimits]]
          name = "DELETION_RATE_LIMITER"
          namespace_id = "2026071808"

          [env.production.ratelimits.simple]
          limit = 5
          period = 60

          [[env.production.ratelimits]]
          name = "STATS_RATE_LIMITER"
          namespace_id = "2026071809"

          [env.production.ratelimits.simple]
          limit = 60
          period = 60

          [[env.production.ratelimits]]
          name = "HEALTH_RATE_LIMITER"
          namespace_id = "2026071810"

          [env.production.ratelimits.simple]
          limit = 120
          period = 60

          [env.production.triggers]
          crons = [
            "0 * * * *",
            "*/5 * * * *"
          ]
          TOML

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          workingDirectory: apps/api
          wranglerVersion: '4.112.0'

      - name: Upload IPBot API key secret
        working-directory: apps/api
        env:
          IPBOT_API_KEY: ${{ secrets.IPBOT_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$IPBOT_API_KEY" ]; then
            echo "IPBOT_API_KEY secret not configured - skipping (IP intel stays disabled)"
            exit 0
          fi
          printf '%s' "$IPBOT_API_KEY" | pnpm exec wrangler secret put IPBOT_API_KEY --env production

  # Build and deploy Web App to Cloudflare Pages
  deploy-web:
    name: Deploy Web App
    runs-on: ubuntu-latest
    needs: deploy-api
    permissions:
      contents: read
      deployments: write
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/out --project-name=amiunique
          wranglerVersion: '4.112.0'

  # Notify deployment status
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy-api.result }}" == "success" ] && [ "${{ needs.deploy-web.result }}" == "success" ]; then
            echo "✅ All deployments successful!"
            echo "🌐 API: https://amiunique-api.7and1.workers.dev"
            echo "🌐 Web: https://amiunique.pages.dev"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
